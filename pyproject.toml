[project]
name = "daily-world-rednote"
version = "0.1.0"
description = "Source-first daily world geography content pipeline for Xiaohongshu"
requires-python = ">=3.10"
dependencies = [
  "Jinja2==3.1.6",
  "Pillow==12.3.0",
  "playwright==1.63.0",
  "pyshp==3.1.6",
  "pypdf==6.16.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
